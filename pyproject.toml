[project]
name = "scim-client-lab"
version = "0.1.0"
description = "Local SCIM 2.0 provisioning client and HTTP journal"
requires-python = ">=3.14,<3.15"
dependencies = ["flask>=3.1", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
